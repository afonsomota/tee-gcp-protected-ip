# Runs the three test suites on every PR (and on push to main for post-merge
# confirmation). Tests only — no deploy steps, no GCP credentials.
#
# All three jobs always run (no path filters): the suites are fast, and the
# HPKE interop fixtures are shared between launcher/tests/fixtures/ and
# frontend/src/attest/interop.test.ts, so a change on either side must be
# proven against both.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  launcher:
    name: Launcher (cargo test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          # The harness (issue #8) compiles to wasm; the launcher loads it.
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Build + sign the harness fixture
        # Rebuild harness.wasm + signature from current source so the tests
        # always run against the live harness, never a stale committed blob.
        run: ../scripts/build-harness.sh

      - name: Test
        run: cargo test

  frontend:
    name: Frontend (pnpm build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (includes tsc --noEmit)
        run: pnpm build

      - name: Test
        run: pnpm test

  verifier:
    name: Verifier (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        # v8 releases exist but astral-sh publishes no moving v8 major tag
        # yet; v7 is the newest resolvable major.
        uses: astral-sh/setup-uv@v7

      - name: Test
        run: uv run --with 'PyJWT[crypto]' --with pytest --with requests pytest scripts/
